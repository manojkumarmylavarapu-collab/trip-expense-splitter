name: TripEX Phase 1 Polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply frontend-only polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="tripex-phase1">\n.hero{background:linear-gradient(135deg,#1f4fff,#6b7cff);color:#fff;border-radius:22px;padding:20px;margin:0 0 14px;box-shadow:0 12px 28px rgba(49,94,251,.18)}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero-kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}.hero-title{font-size:22px;font-weight:850;margin:4px 0 2px}.hero-sub{font-size:13px;opacity:.82}.hero-live{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.hero-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px}.hero-stat small{display:block;font-size:11px;opacity:.76}.hero-stat strong{display:block;font-size:18px;margin-top:2px}.identity{display:flex;align-items:center;gap:14px}.identity label{margin:0}.identity select{max-width:260px}.identity small{margin:0}.settle .line{background:linear-gradient(90deg,#f7f9ff,#fff);border-radius:14px;padding:14px}.settle .line:before{content:'💸 ';}.card h2{display:flex;align-items:center;gap:8px}.card h2:first-letter{font-size:1.05em}@media(max-width:600px){.wrap{padding:18px 12px 42px}.hero{border-radius:18px;padding:17px}.hero-title{font-size:21px}.hero-top{align-items:center}.hero-stats{gap:6px;margin-top:13px}.hero-stat{padding:9px 8px}.hero-stat strong{font-size:16px}.hero-stat small{font-size:10px}.identity{display:block;padding:13px}.identity label{margin-bottom:8px}.identity select{max-width:none}.identity small{margin-top:7px}.card{border-radius:17px;padding:14px;margin-bottom:12px}.card h2{font-size:17px;margin-bottom:12px}.summary{gap:7px}.stat{padding:11px}.value{font-size:18px}.add{gap:6px}.add input{min-width:0}.add .primary{white-space:nowrap}.settle .line{padding:13px}.activity-item{border-radius:13px;padding:12px}.hero-live{font-size:10px;padding:6px 8px}}\n</style>'''
          marker='</head>'
          if 'id="tripex-phase1"' not in s:
              s=s.replace(marker,css+marker,1)
          old='<div id="status" class="status">Connecting to shared trip data…</div>'
          hero='''<div id="status" class="status">Connecting to shared trip data…</div>\n<div class="hero"><div class="hero-top"><div><div class="hero-kicker">Trip dashboard</div><div class="hero-title">Your trip, at a glance</div><div class="hero-sub">Everything shared, tracked and settled in one place.</div></div><div class="hero-live">🟢 LIVE SYNC</div></div><div class="hero-stats"><div class="hero-stat"><small>Total spent</small><strong id="heroTotal">₹0.00</strong></div><div class="hero-stat"><small>People</small><strong id="heroCount">0</strong></div><div class="hero-stat"><small>Expenses</small><strong id="heroExpenses">0</strong></div></div></div>'''
          if 'id="heroTotal"' not in s:
              s=s.replace(old,hero,1)
          wrap='''<script id="tripex-phase1-js">\n(function(){const originalCalc=window.calc;if(typeof originalCalc==='function'){window.calc=function(){originalCalc();const t=document.getElementById('heroTotal'),c=document.getElementById('heroCount'),e=document.getElementById('heroExpenses');if(t)t.textContent=document.getElementById('total')?.textContent||'₹0.00';if(c)c.textContent=document.getElementById('count')?.textContent||'0';if(e)e.textContent=document.getElementById('ecount')?.textContent||'0';};}})();\n</script>'''
          if 'id="tripex-phase1-js"' not in s:
              s=s.replace('</body>',wrap+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish TripEX phase 1 frontend" || true
          git rm .github/workflows/phase1-polish.yml || true
          git commit -m "Remove temporary phase 1 workflow" || true
          git push
