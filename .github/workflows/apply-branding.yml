name: Apply TripEX branding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update branding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Trip Expense Splitter</title>', '<title>TripEX — Split. Track. Settle.</title>', 1)
          old = '<h1>Trip Expense Splitter</h1><div class="sub">One shared trip sheet — edits are saved online and synced between everyone.</div>'
          new = '<h1>TripEX</h1><div class="sub" style="margin-bottom:18px"><span style="font-weight:700">Split. Track. Settle.</span><span style="display:block;font-size:12px;margin-top:4px;color:#7a8496;font-weight:600;letter-spacing:.2px">A Noone Technologies product</span></div>'
          if old not in s:
              raise SystemExit('Expected branding block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit branding and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Brand app as TripEX" || true
          git rm .github/workflows/apply-branding.yml || true
          git commit -m "Remove temporary branding workflow" || true
          git push
