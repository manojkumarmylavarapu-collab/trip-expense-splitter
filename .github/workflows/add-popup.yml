name: Fix trip popup
on:
  push:
    branches: [popup-test]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix popup data source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("ps=window.people||[]", "ps=Array.from((document.getElementById('identity')||{options:[]}).options).slice(1).map(function(o){return o.value})")
          p.write_text(s)
          PY
      - name: Commit popup fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix startup popup name loading" || exit 0
          git push
