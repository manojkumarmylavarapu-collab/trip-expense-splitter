name: Fix mobile balance layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch mobile balance CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="mobile-balance-fix">'
          if marker in s:
              print('Mobile balance fix already present')
              raise SystemExit(0)
          css = '''<style id="mobile-balance-fix">
          @media(max-width:600px){
            .table{overflow:visible!important;margin:0!important}
            .table table{display:block!important;width:100%!important;min-width:0!important}
            .table thead{display:none!important}
            .table tbody{display:grid!important;grid-template-columns:1fr!important;gap:10px!important}
            .table tbody tr{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px 14px!important;padding:14px!important;margin:0!important;border:1px solid var(--border)!important;border-radius:15px!important;background:#fbfcff!important;box-shadow:0 3px 12px rgba(20,33,61,.05)!important}
            .table tbody td{display:block!important;padding:0!important;border:0!important;text-align:left!important;min-width:0!important}
            .table tbody td:first-child{grid-column:1/-1!important;font-size:18px!important;font-weight:800!important;padding-bottom:2px!important}
            .table tbody td:nth-child(2),.table tbody td:nth-child(3),.table tbody td:nth-child(4),.table tbody td:nth-child(5){display:block!important}
            .table tbody td:nth-child(2)::before{content:'Actually Paid';display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
            .table tbody td:nth-child(3)::before{content:'Fair Share';display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
            .table tbody td:nth-child(4)::before{content:'Balance';display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
            .table tbody td:nth-child(5)::before{content:'Result';display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
            .table tbody td:nth-child(4),.table tbody td:nth-child(5){font-weight:800}
          }
          </style>'''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix mobile individual balance cards"
            git push
          fi
