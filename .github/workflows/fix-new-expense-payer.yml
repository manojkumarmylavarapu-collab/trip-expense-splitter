name: Fix new expense payer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payer default
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old1 = "<select data-focus=\"expense:${e.id}:paid_by\" onchange=\"commitExpense(${e.id},'paid_by',this.value)\">${people.map(p=>"
          new1 = "<select data-focus=\"expense:${e.id}:paid_by\" onchange=\"commitExpense(${e.id},'paid_by',this.value)\"><option value=\"\" disabled ${!e.paid_by?'selected':''}>Select payer</option>${people.map(p=>"
          old2 = "sb.from('trip_expenses').insert({paid_by:people[0],amount:0,category:'',remarks:'',last_edited_by:currentUser"
          new2 = "sb.from('trip_expenses').insert({paid_by:'',amount:0,category:'',remarks:'',last_edited_by:currentUser"
          if old1 not in s:
              raise SystemExit('renderExpenses pattern not found')
          if old2 not in s:
              raise SystemExit('addExpense pattern not found')
          s = s.replace(old1, new1, 1)
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-new-expense-payer.yml
          git add index.html .github/workflows/fix-new-expense-payer.yml
          git commit -m "Fix new expense payer selection [skip ci]"
          git push